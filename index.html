<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinguaDrill — Flashcard Drilling</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f6fb; --panel:#fff; --text:#171a21; --muted:#727a8c; --border:#e4e7ef;
    --accent:#5a67ff; --accent-soft:#eceeff;
    --good:#12a150; --good-soft:#e6f7ee;
    --bad:#e5484d; --bad-soft:#fdecec;
    --radius:16px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -14px rgba(16,24,40,.25);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  h1,h2,h3,h4{margin:0 0 10px}
  h2{font-size:18px}

  .btn{
    border:1px solid var(--border); background:#fff; border-radius:10px;
    padding:9px 14px; font-weight:600; font-size:14px; transition:.15s;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none;
  }
  .btn:hover{border-color:#cfd4e2; background:#fafbff}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#4a57f0}
  .btn.ghost{background:transparent; border-color:transparent}
  .btn.ghost:hover{background:rgba(20,25,50,.06)}
  .btn.big{padding:14px 22px; font-size:16px; border-radius:12px}
  .btn.small{padding:6px 10px; font-size:13px}
  .btn.good{background:var(--good); border-color:var(--good); color:#fff}
  .btn.good:hover{background:#0e8a44}
  .btn.bad{background:#fff; border-color:#f0b9bb; color:var(--bad)}
  .btn.bad:hover{background:var(--bad-soft)}
    .btn.danger{color:var(--bad); border-color:#f3c9c9; background:#fff}
  .btn.done{background:var(--good-soft); border-color:#b6e5cb; color:var(--good); font-weight:700}
  .btn.done:hover{background:#d9f2e3; border-color:#9ddbb6}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .icon-btn{background:transparent;border:none;font-size:16px;padding:6px;border-radius:8px;line-height:1}
  .icon-btn:hover{background:#f0f1f7}

  .topbar{
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; margin-right:auto}
  .brand.small{font-size:15px; font-weight:700; margin-right:auto;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .logo{font-size:20px}
  .wrap{max-width:1000px; margin:0 auto; padding:22px 16px 70px}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
  .panel-head h2{margin:0}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .spacer{flex:1}
  .footnote{color:var(--muted); font-size:12.5px; text-align:center; margin-top:24px}
  .empty{text-align:center; padding:60px 20px; color:var(--muted)}
  .empty h2{color:var(--text)}

  .deck-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
    .deck-card{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  /* Meta text row absorbs extra vertical space so the habit strip and
     button row line up across cards of differing content height. */
  .deck-card > .muted.small{ flex: 1 1 auto }
    .deck-top{display:flex; align-items:flex-start; gap:8px}
  .deck-top h3{margin:0; font-size:16px; flex:1; word-break:break-word}
  .deck-reorder{display:flex; flex-direction:column; gap:2px; margin-left:2px}
  .deck-reorder .icon-btn{font-size:10px; padding:3px 6px; line-height:1; color:var(--muted)}
  .deck-reorder .icon-btn:hover:not(:disabled){color:var(--accent); background:#f0f1f7}
  .deck-reorder .icon-btn:disabled{opacity:.25; cursor:not-allowed}
    .pill{
    background:var(--accent-soft); color:var(--accent); font-size:11.5px; font-weight:700;
    padding:3px 8px; border-radius:999px; white-space:nowrap;
  }

  /* Compact inline chips for the per-day stats (reps, time, add-goal) */
  .mini-row{
    display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;
  }
  .mini-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 10px; border-radius:999px;
    background:#f2f3f9; border:1px solid var(--border);
    font-size:12.5px; font-weight:700; color:var(--text);
    font-variant-numeric:tabular-nums; white-space:nowrap;
    line-height:1.2;
  }
  .mini-chip .mini-label{
    color:var(--muted); font-weight:600; font-size:11.5px;
    text-transform:none; letter-spacing:0;
  }
  button.mini-chip{
    cursor:pointer; background:#fff; font:inherit;
    font-size:12.5px; font-weight:700;
  }
  button.mini-chip:hover{ border-color:var(--accent) }
  .mini-chip.done{
    background:var(--good-soft); border-color:#b6e5cb; color:var(--good);
  }
  .mini-chip.done .mini-label{ color:var(--good) }

    .habit{display:flex; gap:4px; flex-wrap:nowrap}
  .habit-cell{
    flex:1 1 0; min-width:0;
    height:44px; border-radius:10px; border:1px solid var(--border); background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10.5px; color:var(--muted); gap:1px; padding:0; transition:.12s;
  }
  .habit-cell b{font-size:13px; color:var(--text); line-height:1}
  .habit-cell:hover{border-color:var(--accent)}
  .habit-cell.done{background:var(--good-soft); border-color:#b6e5cb}
  .habit-cell.done b{color:var(--good)}
  .habit-cell.today{outline:2px solid var(--accent); outline-offset:1px}
  .label{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; display:block}

  .stats{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:14px}
  .stat{display:flex; flex-direction:column; min-width:70px}
  .stat b{font-size:24px; line-height:1.1}
  .stat span{font-size:12px; color:var(--muted)}
    .stat.new b{color:var(--accent)}
  .good{color:var(--good)} .bad{color:var(--bad)}

  .pace{
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid #ccd3ff;
    border-radius:12px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    margin:0 0 14px;
  }
  .pace b{color:var(--accent); font-weight:800}

  .opts{display:flex; flex-direction:column; gap:14px; margin-bottom:18px}
  .seg{display:inline-flex; flex-wrap:wrap; gap:6px; background:#f2f3f9; padding:4px; border-radius:12px}
  .seg-btn{
    border:none; background:transparent; padding:8px 13px; border-radius:9px;
    font-size:13.5px; font-weight:600; color:var(--muted); transition:.12s;
  }
  .seg-btn:hover{color:var(--text)}
    .seg-btn.on{background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(20,25,50,.14)}
  /* Dimmed (but still clickable) so switching is one tap */
  .seg.seg-off{opacity:.45}
  .seg.seg-off .seg-btn{color:var(--muted)}
  .seg.seg-off .seg-btn.on{color:var(--muted); box-shadow:none; background:transparent}
  .check{display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0; cursor:pointer}
  .check input{width:17px; height:17px; accent-color:var(--accent)}

  .range-row{align-items:center}
  .range-label{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--muted)}
  .range-label input{
    width:78px; padding:7px 9px; border:1px solid var(--border); border-radius:9px;
    font:inherit; color:var(--text); background:#fff;
  }
  .range-label input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}

  .card-list{display:flex; flex-direction:column; gap:8px}
  .card-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:1px solid var(--border); border-radius:12px; background:#fff;
  }
  .card-row.is-new{border-left:3px solid var(--accent)}
  .card-num{
    font-size:12.5px; font-weight:800; color:var(--muted);
    min-width:24px; text-align:right; flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .thumbs{display:flex; gap:4px; flex-shrink:0}
  .thumbs img{width:40px; height:40px; object-fit:cover; border-radius:8px; border:1px solid var(--border)}
  .card-texts{flex:1; min-width:0}
  .side-line{display:flex; gap:8px; align-items:baseline; font-size:14px; padding:1px 0}
  .side-line span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tag{
    font-size:10px; font-weight:800; background:var(--accent-soft); color:var(--accent);
    padding:2px 5px; border-radius:5px; flex-shrink:0;
  }
  .tag.b{background:#fdeee0; color:#c2650b}
  .row-actions{display:flex; align-items:center; gap:2px; flex-shrink:0}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px}

      .session-bar{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  /* Direct-child buttons (the ✕ close) should hug the left edge instead
     of stretching across the whole 1fr column. */
  .session-bar > .btn{
    justify-self: start;
    padding: 9px 12px;
    min-width: 0;
  }
  .session-info{ text-align: center; min-width: 0 }
  .session-actions{
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .clock-row{display:flex; gap:12px; justify-content:center; align-items:baseline; margin-top:2px}
  .clock{font-weight:800; font-size:16px; font-variant-numeric:tabular-nums}
  .timer{font-size:13px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums}
    .score{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
  .rep-pill{font-variant-numeric:tabular-nums; white-space:nowrap}
  .rep-pill.done{background:var(--good-soft); color:var(--good); border-color:#b6e5cb}
  .session-wrap{max-width:720px; padding-top:16px}
  .progress{text-align:center; margin-bottom:14px}
  .flash-area{display:flex; flex-direction:column; gap:14px}
  .side{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; text-align:center; box-shadow:var(--shadow);
  }
  .side.task{border-color:#d5daff}
  .side.answer{background:var(--accent-soft); border-color:#ccd3ff}
  .side-img{max-width:100%; max-height:250px; border-radius:12px; display:block; margin:0 auto 12px}
  .side-text{font-size:clamp(21px,5vw,32px); font-weight:700; line-height:1.28; word-break:break-word}
  .side.option{padding:16px; box-shadow:none; border:none; background:transparent}
  .side.option .side-text{font-size:16.5px; font-weight:600; text-align:left}
  .side.option .side-img{max-height:80px; margin:0 0 8px}
  .divider{height:1px; background:var(--border)}
  .judge-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
  .judge-row .btn{padding:16px; font-size:16px}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
  .option{
    background:#fff; border:2px solid var(--border); border-radius:14px; padding:6px;
    text-align:left; transition:.14s; min-height:64px;
  }
  .option:hover:not(:disabled){border-color:var(--accent); transform:translateY(-1px)}
  .option.correct{border-color:var(--good); background:var(--good-soft)}
  .option.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .option.dim{opacity:.45}
  .option:disabled{cursor:default}
    .session-foot{display:flex; gap:10px; justify-content:center; margin-top:26px}

  /* ---------- type-in mode ---------- */
  .type-input{
    width:100%; padding:16px; font-size:20px; font-weight:600;
    border:2px solid var(--border); border-radius:12px; background:#fff;
    text-align:center; font-family:inherit; color:var(--text);
    transition:.15s;
  }
  .type-input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .type-result{
    margin-top:16px; padding:14px 18px; border-radius:12px;
    font-size:15.5px; text-align:center; font-weight:600; line-height:1.4;
    word-break:break-word;
  }
  .type-result.ok{
    background:var(--good-soft); color:var(--good); border:1px solid #b6e5cb;
  }
  .type-result.bad{
    background:var(--bad-soft); color:var(--bad); border:1px solid #f3c9c9;
  }
    .type-result b{ font-weight:800 }

  /* ---------- cloze cards ---------- */
  .cloze-blank{
    display:inline-block; min-width:2.5em; text-align:center;
    background:var(--accent-soft); color:var(--accent);
    border-bottom:2px solid var(--accent); border-radius:6px;
    padding:0 8px; font-weight:700;
  }
  .cloze-revealed{
    display:inline-block;
    background:var(--good-soft); color:var(--good);
    border-radius:6px; padding:0 8px; font-weight:800;
  }
    .cloze-syntax{
    background:#f2f3f9; border:1px solid var(--border); border-radius:6px;
    padding:1px 5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px; color:var(--text);
  }
  #ce-cloze-btn{
    background:var(--accent-soft); border-color:#ccd3ff; color:var(--accent);
    font-weight:700;
  }
  #ce-cloze-btn:hover{ background:#e0e4ff; border-color:var(--accent); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,18,30,.5); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto;
  }
    .modal{
    background:#fff; border-radius:18px; padding:22px; width:100%; max-width:780px;
    max-height:90vh;
    max-height:90dvh;   /* modern browsers: accounts for iOS/Android keyboard & browser chrome */
    overflow:auto; box-shadow:0 30px 70px -25px rgba(0,0,0,.5);
  }
  .modal-actions{display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap}
  .field{display:block; margin-bottom:14px}
  .field span{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px}
  .field input, .field select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    font:inherit; background:#fff; color:var(--text);
  }
  .field input:focus, textarea:focus, select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  textarea{resize:vertical; font-size:15px}
  .editor-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .side-editor{border:1px solid var(--border); border-radius:14px; padding:14px; background:#fbfbfe}
  .side-head{margin-bottom:8px}
  .img-box{
    height:130px; border:1.5px dashed var(--border); border-radius:10px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden;
  }
  .img-box img{max-width:100%; max-height:100%; object-fit:contain}
  .side-editor .row{margin-top:8px}
  .file-btn{cursor:pointer}
  .results .stats{gap:26px}

        /* ---------- desktop two-column deck layout ---------- */
  .wrap.deck-view{
    max-width: 1180px;
    padding-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .deck-col{
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .deck-cols{
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .deck-cols > .deck-col{
    flex: 1 1 0;
  }
  .wrap.deck-view > .panel,
  .wrap.deck-view .deck-col > .panel{
    margin-bottom: 0;
    padding: 14px 16px;
  }
    .wrap.deck-view .panel-head h2,
  .wrap.deck-view .panel > h2{
    font-size: 15.5px;
    margin-bottom: 8px;
  }
    .wrap.deck-view .opts{ gap: 10px; margin-bottom: 12px }

  /* On desktop, lay out the drill options as a compact 2-column grid:
     label in the left column, controls in the right column.
     Mobile keeps the stacked layout (media query below is min-width). */
  @media (min-width: 901px){
    .wrap.deck-view .opts{
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 14px;
      row-gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .wrap.deck-view .opts > div{ display: contents }
    .wrap.deck-view .opts > div > .label{
      grid-column: 1;
      margin-bottom: 0;
      align-self: center;
    }
    .wrap.deck-view .opts > div > :not(.label){
      grid-column: 2;
      min-width: 0;
    }
    .wrap.deck-view .opts > div > p{
      margin: 2px 0 0;
    }
  }
  .wrap.deck-view .label{ margin-bottom: 4px }
  .wrap.deck-view .pace{ padding: 8px 11px; font-size: 12.5px }
  .wrap.deck-view .stats{ gap: 18px; margin-bottom: 10px }
  .wrap.deck-view .stat b{ font-size: 22px }
    .wrap.deck-view .habit-cell{ height: 42px }
  .wrap.deck-view .seg-btn{ padding: 7px 11px; font-size: 13px }
  .wrap.deck-view .check{ margin: 4px 0 }

        @media (max-width: 900px){
    .deck-cols{
      flex-direction: column;
      align-items: stretch;
    }
    .deck-col{
      display: contents;
    }
    /* Re-order on mobile: tracker, drill, transferred, cards */
    .panel-tracker     { order: 1; }
    .panel-drill       { order: 2; }
    .panel-transferred { order: 3; }
    .panel-cards       { order: 4; }

    /* Transferred panel: primary button full width,
       secondary buttons side-by-side, note on its own line. */
    .panel-transferred .row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .panel-transferred .row > .btn.primary{
      grid-column: 1 / -1;
    }
    .panel-transferred .row > .muted.small{
      grid-column: 1 / -1;
      margin-top: 4px;
    }
    .panel-transferred .row > .btn{
      padding: 9px 10px;
      font-size: 13px;
    }
  }

    @media (max-width:640px){
    .editor-grid{grid-template-columns:1fr}
    .options{grid-template-columns:1fr}
    .stats{gap:16px}
    .stat b{font-size:20px}
    .brand{font-size:16px}
    .wrap{padding:16px 12px 60px}

    /* Modal: anchor to the top so the header + rounded corners are never cut off */
    .modal-backdrop{
      align-items: flex-start;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS & STATE
   ========================================================= */
const KEY = 'linguadrill.v1';
const VERSION = 2;

const LANGS = [
  ['en-US','English (US)'], ['en-GB','English (UK)'], ['es-ES','Spanish'], ['fr-FR','French'],
  ['de-DE','German'], ['it-IT','Italian'], ['pt-BR','Portuguese (BR)'], ['pt-PT','Portuguese (PT)'],
  ['ru-RU','Russian'], ['pl-PL','Polish'], ['nl-NL','Dutch'], ['sv-SE','Swedish'],
  ['no-NO','Norwegian'], ['da-DK','Danish'], ['fi-FI','Finnish'], ['tr-TR','Turkish'],
  ['ja-JP','Japanese'], ['ko-KR','Korean'], ['zh-CN','Chinese (Mandarin)'], ['zh-TW','Chinese (Taiwan)'],
  ['ar-SA','Arabic'], ['hi-IN','Hindi'], ['uk-UA','Ukrainian'], ['cs-CZ','Czech'],
  ['el-GR','Greek'], ['he-IL','Hebrew'], ['hu-HU','Hungarian'], ['ro-RO','Romanian'], ['th-TH','Thai']
];

const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');

let state = loadState();
let view = { name: 'home', deckId: null };
let session = null;
let clockHandle = null;

/* =========================================================
   HELPERS
   ========================================================= */
function uid(){
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
  ));
}
function getDeck(id){ return state.decks.find(d => d.id === id); }
function shuffle(arr){
  const r = arr.slice();
  for(let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

/* ---------- cloze helpers ---------- */
function parseClozes(text){
  const out = [];
  const re = /\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g;
  let m;
  while((m = re.exec(text || ''))) out.push({ num: parseInt(m[1], 10), content: m[2], hint: m[3] || '' });
  return out;
}
function clozeNumbers(text){
  const s = new Set();
  parseClozes(text).forEach(c => s.add(c.num));
  return [...s].sort((a, b) => a - b);
}
function clozeContents(text, num){
  return parseClozes(text).filter(c => c.num === num).map(c => c.content);
}
function clozePlainText(text){
  return (text || '').replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, content) => content);
}
// mode: 'prompt' (hide the chosen cloze) or 'answer' (reveal it)
function clozeTextToHTML(text, hideNum, mode){
  const escaped = esc(text || '');
  return escaped.replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, content, hint) => {
    const num = parseInt(n, 10);
    if(num === hideNum && mode === 'prompt'){
      return '<span class="cloze-blank">' + (hint ? '[' + hint + ']' : '[...]') + '</span>';
    }
    if(num === hideNum && mode === 'answer'){
      return '<span class="cloze-revealed">' + content + '</span>';
    }
    return content;   // other clozes just show their text
  });
}
function clozeSideHTML(card, clozeNum, mode, cls){
  const img = card.front.img ? `<img class="side-img" src="${card.front.img}" alt="">` : '';
  const html = clozeTextToHTML(card.front.text, clozeNum, mode);
  return `<div class="side ${cls}">${img}<div class="side-text">${html}</div></div>`;
}
/* =========================================================
   STORAGE
   ========================================================= */
function blankState(){
  return {
    version: VERSION,
    decks: [],
    // Loop now defaults to ON: sessions keep going until you stop them.
         settings: { speak: true, timer: 0, rounds: 0, mode: 'flash', dir: 'fb', hideTimer: false, quizHarder: 'random', cardFilter: 'all', collapseDrill: false, collapseTransferred: false }
  };
}
function loadState(){
  const s = blankState();
  try {
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.decks)) s.decks = parsed.decks;
      if(parsed && parsed.settings) Object.assign(s.settings, parsed.settings);

            // Migration: the old "loop" boolean is now a "rounds" number.
      // loop:true → rounds:0 (∞) | loop:false → rounds:1
      if(s.settings.rounds == null){
        s.settings.rounds = (s.settings.loop === false) ? 1 : 0;
      }
      delete s.settings.loop;
    }
  } catch(e){ console.warn('Could not load saved data', e); }
  s.version = VERSION;

  // Normalise decks
  s.decks.forEach(d => {
    d.cards = Array.isArray(d.cards) ? d.cards : [];
    d.habit = d.habit || {};
        // Migrate old single "goal" into two goals: sessions per day × reps per session
        if(typeof d.sessionsGoal !== 'number' || d.sessionsGoal < 1){
      d.sessionsGoal = (typeof d.goal === 'number' && d.goal >= 1) ? d.goal : 3;
    }
    delete d.goal;
    delete d.repsGoal;
    delete d.repsLog;
    delete d.drillTimeLog;
    d.lang = d.lang || 'en-US';
        d.cards.forEach(c => {
      c.front = c.front || { text: '', img: null };
      c.back  = c.back  || { text: '', img: null };
      c.type  = (c.type === 'cloze') ? 'cloze' : 'basic';
    });
    // Study range
    d.studyRange = d.studyRange || { enabled: false, from: null, to: null };
    if(typeof d.studyRange.enabled !== 'boolean') d.studyRange.enabled = false;
    if(typeof d.studyRange.from !== 'number') d.studyRange.from = null;
        if(typeof d.studyRange.to !== 'number')   d.studyRange.to   = null;
        // Daily "add cards" goal (0 = off) + per-day log of how many cards were added
    d.addGoal = (typeof d.addGoal === 'number' && d.addGoal >= 0) ? d.addGoal : 0;
    d.addedLog = d.addedLog || {};
        // Per-day log of how many distinct cards were studied in this deck
    d.studiedLog = d.studiedLog || {};
        // Info about the last "transferred into Anki" purge, e.g. { date, count } or null
    d.lastTransfer = d.lastTransfer || null;
        });
  return s;
}

/* =========================================================
   PENDING DRAFT (auto-save for the card editor)
   ========================================================= */
// A half-typed new card is temporarily stored for 5 seconds after the
// modal is dismissed, so an accidental close doesn't lose your typing.
let pendingDraft = null;
// Remembers the POS chosen on the last new card, so adding a batch of
// same-type cards is a single tap on the first card only.
let lastPosChoice = '';
// Remembers whether the user wants basic cards auto-generated from each cloze.
let lastClozeAutoBasic = false;
// Set while the new-card modal is open, cleared as soon as it closes.
// Lets `beforeunload` save the draft if the tab is closed mid-typing.
let activeDraftSaver = null;

function savePendingDraft(front, back, pos, type){
  const empty = side => !side || (!side.text?.trim() && !side.img);
  if(empty(front) && empty(back)){
    clearPendingDraft();
    return;
  }
  pendingDraft = {
    type: (type === 'cloze') ? 'cloze' : 'basic',
    front: { text: (front && front.text) || '', img: (front && front.img) || null },
    back:  { text: (back  && back.text)  || '', img: (back  && back.img)  || null },
    pos: (typeof pos === 'string') ? pos : '',
    savedAt: Date.now()
  };
  try { localStorage.setItem(KEY + '.draft', JSON.stringify(pendingDraft)); } catch(e){}
}

function loadPendingDraft(){
  let d = pendingDraft;
  if(!d){
    try {
      const raw = localStorage.getItem(KEY + '.draft');
      if(raw) d = JSON.parse(raw);
    } catch(e){}
  }
  if(!d) return null;
  if(!d.savedAt || Date.now() - d.savedAt > 5000){
    clearPendingDraft();
    return null;
  }
  return d;
}

function clearPendingDraft(){
  pendingDraft = null;
  try { localStorage.removeItem(KEY + '.draft'); } catch(e){}
}

/* =========================================================
   SPEECH
   ========================================================= */
function speak(text, lang){
  if(!text || !text.trim()) return;
  if(!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(lang) u.lang = lang;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  } catch(e){ /* ignore */ }
}
function speakCurrent(){
  if(!session || !session.speak) return;
  const deck = getDeck(session.deckId);
  if(!deck) return;
  const item = session.queue[session.idx];
  if(!item) return;
  const card = deck.cards.find(c => c.id === item.cardId);
  if(!card) return;

  // Cloze cards: don't read the prompt (it would give away the answer).
  if(card.type === 'cloze' && item.clozeNum != null){
    if(session.mode === 'flash' && !session.revealed) return;
    if(session.mode === 'quiz'  && session.picked === null) return;
    if(session.mode === 'type'  && !session.typeResult) return;
    speak(clozePlainText(card.front.text), deck.lang);
    return;
  }

  const side = session.dir === 'fb' ? card.front : card.back;
  speak(side.text, deck.lang);
}

   MODAL
   ========================================================= */
let modalCloseHook = null;
let bodyScrollY = 0;
function openModal(html, wire, onClose){
  modalCloseHook = onClose || null;
  // iOS-friendly scroll lock: freeze the page at its current scroll position
  bodyScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = (-bodyScrollY) + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  modalRoot.innerHTML = '<div class="modal-backdrop"><div class="modal">' + html + '</div></div>';
  const backdrop = modalRoot.querySelector('.modal-backdrop');
  backdrop.addEventListener('mousedown', e => { if(e.target === backdrop) closeModal(); });
  if(wire) wire(modalRoot);
}
function closeModal(){
  const fn = modalCloseHook;
  modalCloseHook = null;
  if(fn){ try { fn(); } catch(e){} }
  modalRoot.innerHTML = '';
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, bodyScrollY);
}

/* =========================================================
   IMAGE HANDLING (resize + compress before storing)
   ========================================================= */
function fileToDataURL(file, maxSide, quality){
  maxSide = maxSide || 900;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function habitStripHTML(d){
  const goal = d.sessionsGoal || 3;
  const letters = ['S','M','T','W','T','F','S'];
  let out = '';
  for(let i = 6; i >= 0; i--){
    const dt = new Date();
    dt.setDate(dt.getDate() - i);
    const key = dayKey(dt);
    const c = d.habit[key] || 0;
    const done = c >= goal;
        out += `<button class="habit-cell ${done ? 'done' : ''} ${i === 0 ? 'today' : ''}"
              data-act="open-habit" data-id="${d.id}" data-date="${key}"
              title="${key} — ${c}/${goal} (click to adjust)">${letters[dt.getDay()]}<b>${c}</b></button>`;
  }
  return out;
}

        </div>

          : '<p class="muted">No cards yet. Add your first one!</p>'}
      </section>
    </main>`;

    const speakEl = document.getElementById('opt-speak');
  if(speakEl) speakEl.onchange = e => { state.settings.speak = e.target.checked; saveState(); };

  const fromEl = document.getElementById('range-from');
  const toEl   = document.getElementById('range-to');
  if(fromEl) fromEl.oninput = e => {
    const v = parseInt(e.target.value, 10);
    d.studyRange.from = (isFinite(v) && v >= 1) ? v : null;
    saveState();
    updateRangeInfo();
  };
  if(toEl) toEl.oninput = e => {
    const v = parseInt(e.target.value, 10);
    d.studyRange.to = (isFinite(v) && v >= 1) ? v : null;
    saveState();
    updateRangeInfo();
  };
  function updateRangeInfo(){
    // cheap live update of the "Studying cards X–Y" hint
    const infoEl = document.querySelector('.range-row + .muted.small');
    if(!infoEl || !total) return;
    let from = d.studyRange.from ? Math.max(1, Math.min(total, d.studyRange.from)) : 1;
    let to   = d.studyRange.to   ? Math.max(1, Math.min(total, d.studyRange.to))   : total;
    if(from > to){ const t = from; from = to; to = t; }
    infoEl.textContent = `Studying cards ${from}–${to} (${to - from + 1} of ${total}).`;
  }
}

/* =========================================================
   FUTURE PREDICTION ("pace" line)
   ========================================================= */
function paceLine(deck){
  const today = dayKey();
  const n = (deck.studiedLog && deck.studiedLog[today]) || 0;
  if(n === 0) return '';
  const week  = n * 7;
  const month = n * 30;
  return '📈 If you keep this pace (<b>' + n + '</b> card' + (n === 1 ? '' : 's') + '/day), '
       + 'you\u2019ll cover ~<b>' + week + '</b> this week and ~<b>' + month + '</b> this month.';
}

/* =========================================================
   EXPORT AS TEXT
   ========================================================= */
function sideToText(side){
  const text = (side && side.text ? side.text : '').trim();
  const hasImg = !!(side && side.img);
  if(text) return text;                    // image silently dropped if text present
  if(hasImg) return '[image only]';        // flag image-only sides
  return '';                               // truly blank side → empty line
}

function buildDeckText(cards){
  const blocks = cards.map(c => {
    if(c.type === 'cloze') return sideToText(c.front);
    return sideToText(c.front) + '\n' + sideToText(c.back);
  });
  // Join with `--` on its own line, and end with a trailing `--` for uniformity
  return blocks.join('\n--\n') + '\n--\n';
}
 
function downloadTextFile(text, filename){
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function cardKey(c){
  const f = c.front || {}, b = c.back || {};
  const ft = (f.text || '').trim().toLowerCase();
  const bt = (b.text || '').trim().toLowerCase();
  // Image-only cards fall back to comparing image data so distinct ones aren't merged
  if(!ft && !bt){
    return 'img:' + (f.img || '') + '|' + (b.img || '');
  }
  return ft + '\u0001' + bt;
}

function countAdditions(target, incoming){
  const existing = new Set(target.cards.map(cardKey));
  let toAdd = 0, skipped = 0;
  incoming.forEach(c => {
    const k = cardKey(c);
    if(existing.has(k)) skipped++;
    else { existing.add(k); toAdd++; }
  });
  return { toAdd, skipped };
}

function exportDeck(deckId){
  const d = getDeck(deckId);
  if(!d) return;
  const payload = {
    linguadrill: 1,
    exportedAt: new Date().toISOString(),
    deck: d
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (d.name || 'deck').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') || 'deck';
  a.href = url;
  a.download = 'linguadrill_' + safeName + '_' + dayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importDeckFlow(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch(err){
        alert('That file is not valid JSON.');
        return;
      }
      const deck = (parsed && parsed.deck) ? parsed.deck : parsed;
      if(!deck || typeof deck !== 'object' || !Array.isArray(deck.cards)){
        alert('That file doesn\u2019t look like a LinguaDrill deck export.');
        return;
      }
      openImportModal(deck, f.name);
    };
    reader.onerror = () => alert('Could not read that file.');
    reader.readAsText(f);
  };
  input.click();
}

function openImportModal(deck, fileName){
  // Regenerate ids so imported cards never collide with existing ones
    const incomingCards = deck.cards.map(c => ({

    front: c.front || { text: '', img: null },
    back:  c.back  || { text: '', img: null },
    pos: c.pos || '',

    reviews: c.reviews || 0,
    correct: c.correct || 0,
    addedAt: c.addedAt || null,
    lastStudied: c.lastStudied || null
  }));

  const hasExisting = state.decks.length > 0;
  const defaultMode = hasExisting ? 'merge' : 'new';

  openModal(`
    <h2>📥 Import deck</h2>
    <p class="muted small" style="margin-top:0">
      From file: <b>${esc(fileName)}</b><br>
      Deck: <b>${esc(deck.name || 'Untitled')}</b> · ${incomingCards.length} card${incomingCards.length === 1 ? '' : 's'}
    </p>

    <div class="opts" style="gap:10px">
      <label class="check">
        <input type="radio" name="imp-mode" value="new" ${defaultMode === 'new' ? 'checked' : ''}>
        Create as a new deck
      </label>
      ${hasExisting ? `
      <label class="check">
        <input type="radio" name="imp-mode" value="merge" ${defaultMode === 'merge' ? 'checked' : ''}>
        Merge into an existing deck
      </label>` : ''}
    </div>

    <div id="imp-new-block" style="display:${defaultMode === 'new' ? '' : 'none'}">
      <label class="field"><span>New deck name</span>
        <input id="imp-name" value="${esc(deck.name || 'Imported deck')}">
      </label>
    </div>

    ${hasExisting ? `
    <div id="imp-merge-block" style="display:${defaultMode === 'merge' ? '' : 'none'}">
      <label class="field"><span>Merge into</span>
        <select id="imp-target">
          ${state.decks.map(d => `<option value="${d.id}">${esc(d.name)} — ${d.cards.length} card${d.cards.length === 1 ? '' : 's'}</option>`).join('')}
        </select>
      </label>
      <p class="muted small" id="imp-preview"></p>
    </div>` : ''}

    <div class="modal-actions">
      <span class="spacer"></span>
      <button class="btn" id="imp-cancel">Cancel</button>
      <button class="btn primary" id="imp-go">Import</button>
    </div>
  `, root => {
    const newRadio   = root.querySelector('input[value="new"]');
    const mergeRadio = root.querySelector('input[value="merge"]');
    const newBlock   = root.querySelector('#imp-new-block');
    const mergeBlock = root.querySelector('#imp-merge-block');
    const targetSel  = root.querySelector('#imp-target');
    const previewEl  = root.querySelector('#imp-preview');

    function updatePreview(){
      if(!targetSel || !previewEl) return;
      const t = getDeck(targetSel.value);
      if(!t){ previewEl.textContent = ''; return; }
      const { toAdd, skipped } = countAdditions(t, incomingCards);
      previewEl.innerHTML = `<b>${toAdd}</b> new card${toAdd === 1 ? '' : 's'} will be added`
        + (skipped > 0 ? ` · <b>${skipped}</b> duplicate${skipped === 1 ? '' : 's'} skipped` : '') + '.';
    }

    function updateVisibility(){
      const mode = (mergeRadio && mergeRadio.checked) ? 'merge' : 'new';
      if(newBlock)   newBlock.style.display   = mode === 'new'   ? '' : 'none';
      if(mergeBlock) mergeBlock.style.display = mode === 'merge' ? '' : 'none';
      updatePreview();
    }

    [newRadio, mergeRadio].forEach(r => { if(r) r.onchange = updateVisibility; });
    if(targetSel) targetSel.onchange = updatePreview;
    updateVisibility();

    root.querySelector('#imp-cancel').onclick = closeModal;

    root.querySelector('#imp-go').onclick = () => {
      const mode = (mergeRadio && mergeRadio.checked) ? 'merge' : 'new';

      if(mode === 'new'){
        const name = (root.querySelector('#imp-name').value || '').trim() || 'Imported deck';
        const newDeck = {
          id: uid(),
          name: name,
          lang: deck.lang || 'en-US',
                                        sessionsGoal: deck.sessionsGoal || deck.goal || 3,
          addGoal: deck.addGoal || 0,
          addedLog: deck.addedLog || {},
          createdAt: Date.now(),
          habit: deck.habit || {},
          cards: incomingCards,
          studyRange: { enabled: false, from: null, to: null },
          studiedLog: deck.studiedLog || {},
          lastTransfer: null
        };
        state.decks.push(newDeck);
        saveState();
        closeModal();
        view = { name: 'deck', deckId: newDeck.id };
        render();
      } else {
        const t = getDeck(targetSel.value);
        if(!t){ closeModal(); return; }
        const existingKeys = new Set(t.cards.map(cardKey));
        let added = 0, skipped = 0;
        incomingCards.forEach(c => {
          const k = cardKey(c);
          if(existingKeys.has(k)){ skipped++; return; }
          existingKeys.add(k);
          t.cards.push(c);
          added++;
        });
        saveState();
        closeModal();
        alert('Added ' + added + ' card' + (added === 1 ? '' : 's')
            + (skipped > 0 ? ' (' + skipped + ' duplicate' + (skipped === 1 ? '' : 's') + ' skipped)' : '')
            + ' to "' + t.name + '".');
        render();
      }
    };
  });
}

/* =========================================================
   TRANSFER TO ANKI (delete cards added on a chosen day)
   ========================================================= */
function openTransferModal(deckId){
  const d = getDeck(deckId);
  if(!d) return;
  const today = dayKey();

  openModal(`
    <h2>📤 Transferred into Anki</h2>
    <p class="muted small" style="margin-top:0">
      Pick the day whose newly-added cards you've now moved into Anki.
      They'll be removed from this deck so they don't pile up here.
    </p>
    <label class="field"><span>Date the cards were added</span>
      <input type="date" id="tr-date" value="${today}" max="${today}">
    </label>
    <p class="small" id="tr-preview"></p>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button class="btn" id="tr-cancel">Cancel</button>
      <button class="btn danger" id="tr-delete" disabled>Delete those cards</button>
    </div>
  `, root => {
    const dateEl    = root.querySelector('#tr-date');
    const previewEl = root.querySelector('#tr-preview');
    const delBtn    = root.querySelector('#tr-delete');

    function updatePreview(){
      const date = dateEl.value;
      if(!date){
        previewEl.innerHTML = '';
        delBtn.disabled = true;
        return;
      }
      const matching = d.cards.filter(c => c.addedAt === date);
      const noDate   = d.cards.filter(c => !c.addedAt).length;

      if(matching.length === 0){
        previewEl.innerHTML = '<span class="muted">No cards were added on this date.</span>';
        delBtn.disabled = true;
      } else {
        previewEl.innerHTML = 'This will remove <b>' + matching.length + '</b> card'
          + (matching.length === 1 ? '' : 's') + ' added on ' + date + '.';
        delBtn.disabled = false;
      }
      if(noDate > 0){
        previewEl.innerHTML += ' <span class="muted">(' + noDate + ' older card'
          + (noDate === 1 ? '' : 's') + ' without a date will be kept.)</span>';
      }
    }

    dateEl.oninput = updatePreview;
    updatePreview();

    root.querySelector('#tr-cancel').onclick = closeModal;

        delBtn.onclick = () => {
      const date = dateEl.value;

      // Collect the cards we're about to remove, along with their original
      // positions, so we can put them back if the user asks to undo.
      const removedCards = [];
      d.cards = d.cards.filter((c, index) => {
        if(c.addedAt === date){
          removedCards.push({ card: c, index: index });
          return false;
        }
        return true;
      });
            const removed = removedCards.length;
      if(removed === 0){ closeModal(); return; }

      // Transferred cards still count as "added today" — you did add them.
      // We no longer touch d.addedLog here.
      d.lastTransfer = {
        date: date,
        count: removed,
        removedCards: removedCards,   // { card, index } pairs
        logDelta: 0                   // kept for backwards compat; no subtraction happens
      };
      saveState();
      closeModal();
      render();
    };
  });
}

/* =========================================================
   STUDY RANGE -> POOL OF CARD IDS
   ========================================================= */
function getRangeIds(deck, range){
  if(!deck) return [];
  const total = deck.cards.length;
  if(!range || !range.enabled) return deck.cards.map(c => c.id);
  if(!total) return [];

  let from = (range.from != null) ? Math.max(1, Math.min(total, range.from)) : 1;
  let to   = (range.to   != null) ? Math.max(1, Math.min(total, range.to))   : total;
  if(from > to){ const t = from; from = to; to = t; }
  return deck.cards.slice(from - 1, to).map(c => c.id);
}

/* =========================================================
   SESSION — SETUP
   ========================================================= */
function startSession(deckId, opts){
  const d = getDeck(deckId);
  if(!d || !d.cards.length){ alert('Add some cards first.'); return; }

    const s = state.settings;
        const o = opts || { mode: s.mode, dir: s.dir, rounds: s.rounds, speak: s.speak, timer: s.timer, quizHarder: s.quizHarder, cardFilter: s.cardFilter };

    const poolIds = getRangeIds(d, d.studyRange);
  if(!poolIds.length){
    alert('Your study range is empty. Adjust the range or switch to "All cards".');
    return;
  }

    // Optional card-type filter: 'all' | 'basic' | 'cloze'
  const typeFilter = (o.cardFilter === 'basic' || o.cardFilter === 'cloze')
    ? o.cardFilter
    : (s.cardFilter === 'basic' || s.cardFilter === 'cloze' ? s.cardFilter : 'all');

  // Build the actual review queue. A basic card = 1 item.
  // A cloze card with {{c1::}} and {{c2::}} becomes 2 items.
  const poolItems = [];
  for(const id of poolIds){
    const card = d.cards.find(c => c.id === id);
    if(!card) continue;
    if(card.type === 'cloze'){
      if(typeFilter === 'basic') continue;
      const nums = clozeNumbers(card.front.text);
      if(!nums.length) continue;
      for(const n of nums) poolItems.push({ cardId: id, clozeNum: n });
    } else {
      if(typeFilter === 'cloze') continue;
      poolItems.push({ cardId: id, clozeNum: null });
    }
  }

  if(!poolItems.length){
    let msg;
    if(typeFilter === 'basic'){
      msg = 'No basic cards in the study range.';
    } else if(typeFilter === 'cloze'){
      msg = 'No cloze cards in the study range.\n'
          + 'Add a cloze card, or switch the Card types filter back to "All".';
    } else {
      msg = 'No drillable cards in the study range.\n'
          + 'Cloze cards need at least one {{c1::...}} marker.';
    }
    alert(msg);
    return;
  }

  if(o.mode === 'quiz' && poolItems.length < 2){
    alert('Quiz mode needs at least 2 cards in the study range.');
    return;
  }

    session = {
    deckId: deckId,
    mode: o.mode,
    dir: o.dir,
            roundsLimit: (typeof o.rounds === 'number' ? o.rounds : 0),   // 0 = ∞
    quizHarder: (typeof o.quizHarder === 'string') ? o.quizHarder : 'random',
    cardFilter: typeFilter,
    speak: !!o.speak,
    timerMin: o.timer || 0,
    remaining: (o.timer || 0) > 0 ? o.timer * 60 : 0,
                paused: false,
    poolIds: poolIds,
    poolItems: poolItems,
    queue: shuffle(poolItems),
        idx: 0,
    round: 1,
    phase: 'main',           // 'main' | 'retry'
    pendingRetries: [],      // card IDs to revisit at the end of this pass
    right: 0,
    wrong: 0,
    answered: 0,
            revealed: false,
    options: null,
    picked: null,
        typeResult: null,      // { typed, ok, correct } during type-in mode
    finished: false
  };

  startClock();
  render();
  speakCurrent();
}

function startClock(){
  clearInterval(clockHandle);
  clockHandle = setInterval(() => {
        if(!session || session.finished || session.paused) return;
    if(session.timerMin > 0){
      session.remaining--;
      if(session.remaining <= 0){
        session.paused = true;
        updateClock();
        showTimeUp();
        return;
      }
    }
    updateClock();
  }, 1000);
}

function updateClock(){
  if(!session) return;
  const t = document.getElementById('timer');
  if(t && session.timerMin > 0) t.textContent = '⏳ ' + fmtTime(Math.max(0, session.remaining));
}

function showTimeUp(){
  const mins = session.timerMin;
  openModal(`
    <h2>⏰ Time's up!</h2>
    <p>You set a ${mins}-minute timer. Do you want to keep going or stop here?</p>
    <div class="modal-actions">
      <button class="btn" id="tu-stop">Stop &amp; see results</button>
      <span class="spacer"></span>
      <button class="btn primary" id="tu-continue">Keep going (+${mins} min)</button>
    </div>
  `, root => {
    root.querySelector('#tu-continue').onclick = () => {
      if(!session) return;
      session.remaining = mins * 60;
      session.paused = false;
      closeModal();
      updateClock();
    };
    root.querySelector('#tu-stop').onclick = () => {
      closeModal();
      finishSession();
    };
  });
}

function sideHTML(side, cls){

/* ---------- similarity helpers for harder quizzes ---------- */
function levenshtein(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    curr[0] = i;
    for(let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    const t = prev; prev = curr; curr = t;
  }
  return prev[n];
}

function similarity(a, b){
  a = (a || '').toLowerCase().trim();
  b = (b || '').toLowerCase().trim();
  if(!a && !b) return 1;
  if(!a || !b) return 0;
  const maxLen = Math.max(a.length, b.length);
  return 1 - levenshtein(a, b) / maxLen;
}

function pickDistractors(candidates, card, ansSide, mode){
  // candidates: [{ side, card, key }], correct card already excluded
  const correctText = (card[ansSide].text || '').trim();

  // No text on the answer side → fall back to random
  if(!correctText) mode = 'random';

  const shuffled = shuffle(candidates);
  let primary = [];
  let fallback = [];

  if(mode === 'both' && card.pos){
    const scored = candidates.map(c => ({
      ...c,
      sim: similarity(correctText, (c.side.text || '').trim())
    })).filter(c => c.card.pos === card.pos).sort((a, b) => b.sim - a.sim);
    primary = scored;
    fallback = candidates.map(c => ({
      ...c,
      sim: similarity(correctText, (c.side.text || '').trim())
    })).sort((a, b) => b.sim - a.sim);
  } else if(mode === 'similar'){
    const scored = candidates.map(c => ({
      ...c,
      sim: similarity(correctText, (c.side.text || '').trim())
    })).sort((a, b) => b.sim - a.sim);
    primary = scored;
  } else if(mode === 'samePos' && card.pos){
    primary = shuffle(candidates.filter(c => c.card.pos === card.pos));
    fallback = shuffled;
  } else {
    primary = shuffled;
  }

  const out = [];
  const used = new Set();
  for(const c of primary){
    if(out.length >= 3) break;
    if(used.has(c.key)) continue;
    used.add(c.key);
    out.push(c.side);
  }
  for(const c of fallback){
    if(out.length >= 3) break;
    if(used.has(c.key)) continue;
    used.add(c.key);
    out.push(c.side);
  }
  return out;
}

function buildOptions(deck, card, ansSide, poolIds, harderMode){
  const correct = card[ansSide];
  const keyOf = s => (s.text || '').trim().toLowerCase()
                  || (s.img ? 'img:' + s.img.length + '_' + s.img.slice(-24) : '');

  const seen = new Set([keyOf(correct)]);

  // Build a unified candidate list: prefer cards in the study range first,
  // then top up with the rest of the deck.
  const poolSet = new Set(poolIds || []);
  const ordered = [
    ...deck.cards.filter(c => c.id !== card.id && poolSet.has(c.id)),
    ...deck.cards.filter(c => c.id !== card.id && !poolSet.has(c.id))
  ];

  const candidates = [];
  for(const c of ordered){
    const s = c[ansSide];
    const k = keyOf(s);
    if(!k || seen.has(k)) continue;
    seen.add(k);
    candidates.push({ side: s, card: c, key: k });
  }

  const distractors = pickDistractors(candidates, card, ansSide, harderMode || 'random');

    const opts = [{ side: correct, correct: true }]
    .concat(distractors.map(s => ({ side: s, correct: false })));
  return shuffle(opts);
}

/* Distractors for a cloze card: pull other cloze answers and card backs. */
function buildClozeQuizOptions(deck, card, clozeNum, poolIds, harderMode){
  const contents = clozeContents(card.front.text, clozeNum);
  const correctText = (contents[0] || '').trim();
  const correctSide = { text: correctText, img: null };

  const poolSet = new Set(poolIds || []);
  const seen = new Set(contents.map(s => s.trim().toLowerCase()));
  const candidates = [];

  const ordered = [
    ...deck.cards.filter(c => c.id !== card.id && poolSet.has(c.id)),
    ...deck.cards.filter(c => c.id !== card.id && !poolSet.has(c.id))
  ];

  for(const c of ordered){
    if(c.type === 'cloze'){
      for(const cl of parseClozes(c.front.text)){
        const t = (cl.content || '').trim();
        const k = t.toLowerCase();
        if(!t || seen.has(k)) continue;
        seen.add(k);
        candidates.push({ side: { text: t, img: null }, text: t });
      }
    } else {
      const t = (c.back.text || '').trim();
      const k = t.toLowerCase();
      if(!t || seen.has(k)) continue;
      seen.add(k);
      candidates.push({ side: { text: t, img: null }, text: t });
    }
  }

  let picked;
  if(harderMode === 'similar' || harderMode === 'both'){
    picked = candidates
      .map(c => ({ ...c, sim: similarity(correctText, c.text) }))
      .sort((a, b) => b.sim - a.sim)
      .slice(0, 3);
  } else {
    picked = shuffle(candidates).slice(0, 3);
  }

  const opts = [{ side: correctSide, correct: true }]
    .concat(picked.map(p => ({ side: p.side, correct: false })));
  return shuffle(opts);
}

function optionClass(o, i){
  if(session.picked === null) return '';
  if(o.correct) return 'correct';
  if(i === session.picked) return 'wrong';
  return 'dim';
}

function renderSession(){
  const deck = getDeck(session.deckId);
  if(!deck){ session = null; view = { name: 'home', deckId: null }; return render(); }
  if(session.finished) return renderResults(deck);

            if(session.idx >= session.queue.length){
    if(session.pendingRetries && session.pendingRetries.length > 0){
      // Wrong answers come back at the end of the pass — still part of the same round.
      session.queue = session.pendingRetries;
      session.pendingRetries = [];
      session.idx = 0;
      session.phase = 'retry';
    } else {
      // Full round complete (main pass + all retries cleared).
      if(session.roundsLimit > 0 && session.round >= session.roundsLimit){
        finishSession();
        return;
      }
      session.queue = shuffle(session.poolItems);
      session.idx = 0;
      session.round++;
      session.phase = 'main';
    }
  }

  const item = session.queue[session.idx];
  const card = item ? deck.cards.find(c => c.id === item.cardId) : null;
  if(!card){
    session.queue.splice(session.idx, 1);
    if(!session.queue.length){ finishSession(); return; }
    return renderSession();
  }

  const isCloze = card.type === 'cloze' && item.clozeNum != null;
  const askSide = session.dir === 'fb' ? 'front' : 'back';
  const ansSide = session.dir === 'fb' ? 'back' : 'front';

  const askHTML = isCloze
    ? clozeSideHTML(card, item.clozeNum, 'prompt', 'task')
    : sideHTML(card[askSide], 'task');
  const ansHTML = isCloze
    ? clozeSideHTML(card, item.clozeNum, 'answer', 'answer')
    : sideHTML(card[ansSide], 'answer');

  let body = '';
    if(session.mode === 'flash'){
    body = `
      <div class="flash-area">
        ${askHTML}
        ${session.revealed
          ? `<div class="divider"></div>${ansHTML}`
          : `<button class="btn primary big" data-act="reveal">Reveal answer</button>`}
      </div>
      ${session.revealed
        ? `<div class="judge-row">
             <button class="btn bad big" data-act="judge" data-v="0">✗ Wrong</button>
             <button class="btn good big" data-act="judge" data-v="1">✓ Right</button>
           </div>`
        : ''}`;
        } else if(session.mode === 'type'){
    const answerText = isCloze
      ? (clozeContents(card.front.text, item.clozeNum)[0] || '')
      : (card[ansSide].text || '').trim();

    if(!answerText){
      // No text on the answer side → fall back to flash-style self-judge
      body = `
        <div class="flash-area">
          ${askHTML}
          ${session.revealed
            ? `<div class="divider"></div>${ansHTML}`
            : `<button class="btn primary big" data-act="reveal">Reveal answer (no text — self-judge)</button>`}
        </div>
        ${session.revealed
          ? `<div class="judge-row">
               <button class="btn bad big" data-act="judge" data-v="0">✗ Wrong</button>
               <button class="btn good big" data-act="judge" data-v="1">✓ Right</button>
             </div>`
          : ''}`;
    } else if(!session.typeResult){
      body = `
        <div class="flash-area">${askHTML}</div>
        <div style="margin-top:14px">
          <input type="text" id="type-input" class="type-input"
                 placeholder="Type the answer…" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <button class="btn primary big" data-act="type-submit"
                style="width:100%; margin-top:12px">Submit</button>
        <p class="muted small" style="text-align:center; margin-top:10px">
          Not case-sensitive · press Enter to submit
        </p>`;
    } else {
      const r = session.typeResult;
      body = `
        <div class="flash-area">${askHTML}</div>
        <div class="divider"></div>
        ${ansHTML}
        <div class="type-result ${r.ok ? 'ok' : 'bad'}">
          ${r.ok
            ? '✓ Correct'
            : '✗ Your answer: <b>' + (esc(r.typed) || '<i>(blank)</i>') + '</b>'}
        </div>
        <button class="btn primary big" data-act="type-next"
                style="width:100%; margin-top:14px">Next →</button>
        <p class="muted small" style="text-align:center; margin-top:8px">Press Enter to continue</p>`;
    }
    } else {
    if(!session.options){
      session.options = isCloze
        ? buildClozeQuizOptions(deck, card, item.clozeNum, session.poolIds, session.quizHarder)
        : buildOptions(deck, card, ansSide, session.poolIds, session.quizHarder);
    }
    body = `
      <div class="flash-area">${askHTML}</div>
      <div class="options">
        ${session.options.map((o, i) => `
          <button class="option ${optionClass(o, i)}"
                  data-act="pick" data-i="${i}"
                  ${session.picked !== null ? 'disabled' : ''}>
            ${sideHTML(o.side, 'option')}
          </button>`).join('')}
      </div>`;
  }

  const rangeNote = (session.poolIds.length !== deck.cards.length)
    ? ` · studying ${session.poolIds.length} of ${deck.cards.length} cards`
    : '';

  app.innerHTML = `
        <header class="topbar session-bar">
      <button class="btn ghost" data-act="end" title="End session">✕</button>
      <div class="session-info">
        <span class="muted small">
                    ${esc(deck.name)} · ${session.mode === 'flash' ? 'Flashcards' : session.mode === 'quiz' ? 'Quiz' : 'Type answer'} · ${session.dir === 'fb' ? 'Front → Back' : 'Back → Front'}${rangeNote}
        </span>
                ${(!state.settings.hideTimer && session.timerMin > 0) ? `
                    <div class="clock-row">
            <span class="timer" id="timer">⏳ ${fmtTime(session.remaining)}</span>
          </div>` : ''}
      </div>
                        <div class="session-actions">
        ${session.timerMin > 0 ? `<button class="btn ghost small" data-act="toggle-timer"
                title="${state.settings.hideTimer ? 'Show timer' : 'Hide timer'}">
          ${state.settings.hideTimer ? '👁' : '⏱'}
                </button>` : ''}
        <div class="score"><span class="good">${session.right}</span> / <span class="bad">${session.wrong}</span></div>
      </div>
    </header>
    <main class="wrap session-wrap">
                  <div class="progress muted small">
        ${session.phase === 'retry'
          ? '<span class="bad" style="font-weight:700">↻ Mistakes</span> · '
          : ''}
        Card ${session.idx + 1} of ${session.queue.length}
        ${session.roundsLimit > 0
          ? ' · round ' + session.round + '/' + session.roundsLimit
          : (session.round > 1 ? ' · round ' + session.round : '')}
      </div>
      ${body}
            <div class="session-foot">
        <button class="btn ghost small" data-act="speak">🔊 Read again</button>
        <button class="btn ghost small" data-act="end">End session</button>
      </div>
    </main>`;

  // Type-in mode: auto-focus the input so the user can start typing right away,
  // and let Enter submit without needing to click.
  if(session.mode === 'type'){
    const inp = document.getElementById('type-input');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          const btn = document.querySelector('[data-act="type-submit"]');
          if(btn) btn.click();
        }
      });
    }
  }
}

/* =========================================================
   SESSION — LOGIC
   ========================================================= */
function recordAnswer(ok){
  const deck = getDeck(session.deckId);
  if(!deck) return;
  const item = session.queue[session.idx];
  if(item){
    const card = deck.cards.find(c => c.id === item.cardId);
    if(card){
      card.studied = true;
      card.reviews = (card.reviews || 0) + 1;
      if(ok) card.correct = (card.correct || 0) + 1;

      // Bump today's "distinct cards studied" counter, but only once per card per day
      const today = dayKey();
      if(card.lastStudied !== today){
        card.lastStudied = today;
        deck.studiedLog = deck.studiedLog || {};
        deck.studiedLog[today] = (deck.studiedLog[today] || 0) + 1;
      }

      // Wrong answers get one more appearance at the end of this pass.
      if(!ok){
        session.pendingRetries = session.pendingRetries || [];
        const already = session.pendingRetries.some(
          it => it.cardId === item.cardId && it.clozeNum === item.clozeNum
        );
        if(!already) session.pendingRetries.push({ cardId: item.cardId, clozeNum: item.clozeNum });
      }
    }
  }
  session.answered++;
  if(ok) session.right++; else session.wrong++;
  saveState();
}

function advance(){
  if(!session || session.finished) return;
  session.idx++;
  session.revealed = false;
  session.options = null;
  session.picked = null;
  session.typeResult = null;
  render();
  if(session && !session.finished) speakCurrent();
}

function judge(ok){
  if(!session) return;
  if(session.mode !== 'flash' && session.mode !== 'type') return;
  if(!session.revealed) return;
  recordAnswer(ok);
  session.revealed = false;
  advance();
}

function pickOption(i){
  if(!session || session.picked !== null || !session.options) return;
  session.picked = i;
  const ok = !!session.options[i].correct;
  recordAnswer(ok);
  renderSession();
  const delay = ok ? 750 : 1300;
  setTimeout(() => {
    if(!session || session.finished) return;
    session.picked = null;
    session.options = null;
    advance();
  }, delay);
}

function finishSession(){
  if(!session) return;
  session.finished = true;
  session.paused = true;
  clearInterval(clockHandle);
  if('speechSynthesis' in window){ try { window.speechSynthesis.cancel(); } catch(e){} }
  render();
}

function renderResults(deck){
  const total = session.right + session.wrong;
  const acc = total ? Math.round(session.right / total * 100) : 0;

  app.innerHTML = `
    <header class="topbar">
      <div class="brand small">${esc(deck.name)} — session results</div>
    </header>
    <main class="wrap">
      <section class="panel results">
        <h2>Session complete 🎉</h2>
                                <div class="stats">
          <div class="stat"><b>${total}</b><span>cards answered</span></div>
          <div class="stat"><b class="good">${session.right}</b><span>right</span></div>
          <div class="stat"><b class="bad">${session.wrong}</b><span>wrong</span></div>
                    <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
        </div>
                ${paceLine(deck) ? `<div class="pace" style="margin-top:8px">${paceLine(deck)}</div>` : ''}
                        <div class="modal-actions">
          <button class="btn" data-act="tick-today">✓ Mark today's session</button>
          <span class="spacer"></span>
          <button class="btn" data-act="back-deck">Back to deck</button>
          <button class="btn primary" data-act="again">Drill again</button>
        </div>
      </section>
    </main>`;
}

function restartSession(){
  if(!session) return;
  const deckId = session.deckId;
                    const opts = {
    mode: session.mode,
    dir: session.dir,
    rounds: session.roundsLimit,
    speak: session.speak,
    timer: session.timerMin,
    quizHarder: session.quizHarder,
    cardFilter: session.cardFilter
  };
  clearInterval(clockHandle);
  session = null;
  startSession(deckId, opts);
}

/* =========================================================
   HABIT TRACKER
   ========================================================= */
function openHabitModal(deckId, date){
  const d = getDeck(deckId);
  if(!d) return;
      const goal = d.sessionsGoal || 3;

  function body(){
    const cur = d.habit[date] || 0;
    const done = cur >= goal;
    return `
      <h2>${date}</h2>
            <p class="muted small" style="margin-top:0">${goal} session${goal === 1 ? '' : 's'}/day</p>
      <div class="row" style="justify-content:center; align-items:center; gap:18px; margin:24px 0 8px">
        <button class="btn" id="hb-minus" style="width:56px; height:56px; font-size:24px; font-weight:800; border-radius:14px"
                ${cur <= 0 ? 'disabled' : ''}>−</button>
        <div style="font-size:52px; font-weight:800; min-width:90px; text-align:center; line-height:1; ${done ? 'color:var(--good)' : ''}">
          ${cur}
        </div>
        <button class="btn primary" id="hb-plus" style="width:56px; height:56px; font-size:24px; font-weight:800; border-radius:14px">+</button>
      </div>
      <p class="small" style="text-align:center; margin-top:0; ${done ? 'color:var(--good); font-weight:700' : 'color:var(--muted)'}">
        ${done ? '✓ goal reached' : (goal - cur) + ' more to reach goal'}
      </p>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn danger" id="hb-clear" ${cur <= 0 ? 'disabled' : ''}>Clear (0)</button>
        <span class="spacer"></span>
        <button class="btn primary" id="hb-done">Done</button>
      </div>`;
  }

  openModal(body(), root => {
    function wire(){
      root.querySelector('#hb-minus').onclick = () => {
        const cur = d.habit[date] || 0;
        const next = Math.max(0, cur - 1);
        if(next === 0) delete d.habit[date];
        else d.habit[date] = next;
        saveState();
        render();                                   // refresh deck behind the modal
        root.querySelector('.modal').innerHTML = body();
        wire();
      };
      root.querySelector('#hb-plus').onclick = () => {
        const cur = d.habit[date] || 0;
        d.habit[date] = cur + 1;
        saveState();
        render();
        root.querySelector('.modal').innerHTML = body();
        wire();
      };
      root.querySelector('#hb-clear').onclick = () => {
        delete d.habit[date];
        saveState();
        render();
        root.querySelector('.modal').innerHTML = body();
        wire();
      };
      root.querySelector('#hb-done').onclick = () => {
        closeModal();
        render();
      };
    }
    wire();
  });
}

function tickDay(deckId, date){
  const d = getDeck(deckId);
  if(!d) return;
  d.habit = d.habit || {};
    const goal = d.sessionsGoal || 3;
  const cur = d.habit[date] || 0;
  const next = cur >= goal ? 0 : cur + 1;
  if(next === 0) delete d.habit[date];
  else d.habit[date] = next;
  saveState();
  render();
}

/* =========================================================
   GLOBAL CLICK HANDLER
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
        case 'new-deck':
      openNewDeck();
      break;

        case 'export-deck':
      exportDeck(id || view.deckId);
      break;

    case 'export-text':
      openTextExportModal(id || view.deckId);
      break;

    case 'import-deck':
      importDeckFlow();
      break;

    case 'open-deck':
      view = { name: 'deck', deckId: id };
      render();
      break;

    case 'home':
      clearInterval(clockHandle);
      session = null;
      view = { name: 'home', deckId: null };
      render();
      break;

        case 'del-deck': {
      const d = getDeck(id);
      if(d && confirm('Delete deck "' + d.name + '" and all of its cards?')){
        state.decks = state.decks.filter(x => x.id !== id);
        saveState();
        render();
      }
      break;
    }

    case 'move-deck': {
      const dir = parseInt(el.dataset.dir, 10) || 0;
      const idx = state.decks.findIndex(x => x.id === id);
      if(idx < 0 || dir === 0) break;
      const newIdx = idx + dir;
      if(newIdx < 0 || newIdx >= state.decks.length) break;
      [state.decks[idx], state.decks[newIdx]] = [state.decks[newIdx], state.decks[idx]];
      saveState();
      render();
      break;
    }

            case 'tick-day':
      tickDay(id, el.dataset.date);
      break;

        case 'open-habit':
      openHabitModal(id, el.dataset.date);
      break;

                      case 'reset-studied-today': {
      const d = getDeck(id || view.deckId);
      if(!d) break;
      const today = dayKey();
      const n = (d.studiedLog && d.studiedLog[today]) || 0;
      if(!n){
        alert('Nothing studied today yet.');
        break;
      }
      if(!confirm('Reset today\u2019s "cards studied" counter from ' + n + ' to 0?\n\n'
                + 'The cards themselves keep their "studied" status and their images/text.')) break;
      if(d.studiedLog) delete d.studiedLog[today];
      // Clear the per-card stamp so re-studying today counts again
      d.cards.forEach(c => {
        if(c.lastStudied === today) delete c.lastStudied;
      });
      saveState();
      render();
      break;
    }

        case 'deck-settings':
      openDeckSettings(id || view.deckId);
      break;

        case 'transfer-anki':
      openTransferModal(id || view.deckId);
      break;

    case 'undo-transfer': {
      const d = getDeck(id || view.deckId);
      if(!d || !d.lastTransfer || !d.lastTransfer.removedCards) break;
      const { date, removedCards, logDelta, count } = d.lastTransfer;

      if(!confirm('Restore ' + count + ' card' + (count === 1 ? '' : 's')
                + ' that were transferred on ' + date + '?')) break;

      // Put the cards back in their original positions, lowest index first
      const sorted = removedCards.slice().sort((a, b) => a.index - b.index);
      for(const item of sorted){
        const at = Math.min(item.index, d.cards.length);
        d.cards.splice(at, 0, item.card);
      }

      // Restore the day's "added" counter
      if(logDelta > 0){
        d.addedLog = d.addedLog || {};
        d.addedLog[date] = (d.addedLog[date] || 0) + logDelta;
      }

            d.lastTransfer = null;
      saveState();
      render();
      break;
    }

    case 'forget-transfer': {
      const d = getDeck(id || view.deckId);
      if(!d || !d.lastTransfer || !d.lastTransfer.removedCards) break;
      const { date, count } = d.lastTransfer;
      if(!confirm('Permanently forget the last transfer?\n\n'
                + count + ' card' + (count === 1 ? '' : 's') + ' removed on ' + date + ' '
                + 'will no longer be recoverable.\n\nThis frees up storage. '
                + 'The "Last transfer" note stays, but Undo will disappear.')) break;

      d.lastTransfer = {
        date: date,
        count: count
      };
      saveState();
      render();
      break;
    }

    case 'new-card':
      openCardEditor(view.deckId, null);
      break;

    case 'edit-card':
      openCardEditor(view.deckId, id);
      break;

        case 'del-card': {
      const d = getDeck(view.deckId);
      if(d && confirm('Delete this card?')){
        const card = d.cards.find(c => c.id === id);
        d.cards = d.cards.filter(c => c.id !== id);
        // If this card was itself added today, adjust today's "added" count
        if(card && card.addedAt === dayKey() && d.addedLog){
          const todayKey = dayKey();
          d.addedLog[todayKey] = Math.max(0, (d.addedLog[todayKey] || 0) - 1);
        }
        saveState();
        render();
      }
      break;
    }

        case 'set-mode':
      state.settings.mode = el.dataset.v; saveState(); render();
      break;
        case 'set-quiz-harder':
      state.settings.quizHarder = el.dataset.v || 'random';
      saveState(); render();
      break;
    case 'toggle-collapse': {
      const key = el.dataset.id;
      if(key === 'collapseDrill' || key === 'collapseTransferred'){
        state.settings[key] = !state.settings[key];
        saveState(); render();
      }
      break;
    }
    case 'set-dir':
      state.settings.dir = el.dataset.v; saveState(); render();
      break;
            case 'set-timer': {
      const v = parseInt(el.dataset.v, 10) || 0;
      state.settings.timer = v;
      if(v > 0) state.settings.rounds = 0;   // timer and rounds are mutually exclusive
      saveState();
      render();
      break;
    }
    case 'set-rounds': {
      const v = parseInt(el.dataset.v, 10) || 0;
      state.settings.rounds = v;
      if(v > 0) state.settings.timer = 0;    // rounds and timer are mutually exclusive
      saveState();
      render();
      break;
    }

        case 'set-range-mode': {
      const d = getDeck(view.deckId);
      if(d){
        d.studyRange.enabled = (el.dataset.v === 'range');
        saveState();
        render();
      }
      break;
    }

    case 'set-card-filter':
      state.settings.cardFilter = (el.dataset.v === 'basic' || el.dataset.v === 'cloze') ? el.dataset.v : 'all';
      saveState();
      render();
      break;

        case 'start':
      startSession(view.deckId);
      break;

        case 'toggle-timer':
      state.settings.hideTimer = !state.settings.hideTimer;
      saveState();
      render();
      break;

                        case 'type-submit': {
      if(!session || session.mode !== 'type') break;
      const inp = document.getElementById('type-input');
      const typed = inp ? inp.value : '';
      const deck = getDeck(session.deckId);
      if(!deck) break;
      const item = session.queue[session.idx];
      if(!item) break;
      const card = deck.cards.find(c => c.id === item.cardId);
      if(!card) break;
      const isCloze = card.type === 'cloze' && item.clozeNum != null;
      let accepted, correct;
      if(isCloze){
        accepted = clozeContents(card.front.text, item.clozeNum);
        correct = accepted[0] || '';
      } else {
        const ansSide = session.dir === 'fb' ? 'back' : 'front';
        correct = (card[ansSide].text || '').trim();
        accepted = [correct];
      }
      const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
      const ok = accepted.some(a => norm(a) === norm(typed));
      session.typeResult = { typed: typed, ok: ok, correct: correct };
      recordAnswer(ok);
      render();
      break;
    }

    case 'type-next': {
      if(!session || session.mode !== 'type') break;
      advance();
      break;
    }

    case 'reveal':
      if(session){ session.revealed = true; render(); }
      break;

    case 'judge':
      judge(el.dataset.v === '1');
      break;

    case 'pick':
      pickOption(parseInt(el.dataset.i, 10));
      break;

    case 'speak':
      speakCurrent();
      break;

    case 'end':
      if(session && confirm('End this session and see your results?')) finishSession();
      break;

    case 'back-deck': {
      const did = session ? session.deckId : view.deckId;
      clearInterval(clockHandle);
      session = null;
      view = { name: 'deck', deckId: did };
      render();
      break;
    }

    case 'again':
      restartSession();
      break;

        case 'tick-today':
      if(session) tickDay(session.deckId, dayKey());
      break;

      }
});

/* =========================================================
   KEYBOARD SHORTCUTS (during a session)
   ========================================================= */
document.addEventListener('keydown', e => {
  if(!session || session.finished) return;

  // In type mode, Enter on the results screen advances to the next card.
  if(session.mode === 'type' && session.typeResult && e.key === 'Enter'){
    e.preventDefault();
    advance();
    return;
  }

  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

  if(session.mode === 'flash'){
    if(e.code === 'Space' || e.key === 'Enter'){
      e.preventDefault();
      if(!session.revealed){
        session.revealed = true; render();
      }
    } else if(session.revealed){
      if(e.key === '1' || e.key === 'ArrowLeft' || e.key.toLowerCase() === 'f'){
        judge(false);
      } else if(e.key === '2' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'j'){
        judge(true);
      }
    }
  } else {
    if(session.picked === null){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4 && session.options && session.options[n - 1]){
        pickOption(n - 1);
      }
    }
  }

  if(e.key === 'r' && !e.ctrlKey && !e.metaKey){
    speakCurrent();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener('beforeunload', () => {
  clearInterval(clockHandle);
  if('speechSynthesis' in window){ try { window.speechSynthesis.cancel(); } catch(e){} }
  if(activeDraftSaver){ try { activeDraftSaver(); } catch(e){} }
});

try {
  // Persist any migration (loop default flip, studyRange normalisation, version bump)
  saveState();
  render();
} catch(err){
  console.error(err);
  app.innerHTML = '<div class="empty"><h2>Something went wrong</h2>'
    + '<p>' + esc(err && err.message ? err.message : String(err)) + '</p>'
    + '<p class="small">Open the browser console (F12) for details.</p></div>';
}

})();
</script>
